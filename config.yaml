# 只读白名单：命中即 R0 直接放行（按顺序匹配）
readonly_patterns:
  - ^kubectl[ \t]+(get|describe|logs|top|api-resources|config[ \t]+view)(?=[ \t]|$)
  - ^systemctl[ \t]+(status|list-units|list-timers|show|is-active|is-enabled|is-system-running|list-dependencies|--failed)(?=[ \t]|$)
  - ^journalctl(?=[ \t]|$)
  - ^docker[ \t]+(ps|images|logs|inspect|stats|port|top|version|info)(?=[ \t]|$)
  - ^docker[ \t]+compose[ \t]+(ps|logs|config|top)(?=[ \t]|$)
  - ^(cat|less|head|tail|grep|egrep|ls|find|ps|top|htop|df|du|free|uname|uptime|which|whoami|id|echo|w|who)(?=[ \t]|$)
  - ^env[ \t]*$
  - ^hostname(?:[ \t]+(?:-[afisdI]|--fqdn|--short|--ip-address|--domain|--all-ip-addresses))*[ \t]*$
  - ^date(?:[ \t]+(?:-u|--utc|--universal))*[ \t]*$
  - ^date(?:[ \t]+(?:-u|--utc|--universal))*[ \t]+\+(?:[^[ \t]'"]+|'[^']*'|"[^"]*")[ \t]*$
  # ssh 直连（未注册主机的只读排查）：远程命令集与本机白名单对齐（不含 env——
  # 远程环境变量更可能含生产密钥，不进模型上下文）；不允许 -o 选项
  # （ProxyCommand 等可执行本地命令），单引号也不放行——统一用双引号。
  # core._classify_ssh 校验整条 SSH 形状后复用本机分类，避免只匹配远程命令前缀。
  - ^git[ \t]+(status|log|diff|show|blame|rev-parse|ls-files|ls-remote|rev-list|cat-file|for-each-ref|shortlog|describe|grep|count-objects)(?=[ \t]|$)
  - ^git[ \t]+reflog(?:[ \t]+(?:show|list)(?=[ \t]|$)|[ \t]*$)
  - ^git[ \t]+branch[ \t]*$
  - ^git[ \t]+branch[ \t]+(-[avr]+|--all|--list)[ \t]*$
  - ^git[ \t]+remote(?:[ \t]+(-v|--verbose))?[ \t]*$
  - ^git[ \t]+remote[ \t]+show(?=[ \t]|$)
  - ^git[ \t]+stash[ \t]+(list|show)(?=[ \t]|$)
  - ^git[ \t]+tag[ \t]+(-l|--list)(?=[ \t]|$)
  - ^git[ \t]+config[ \t]+--get(?=[ \t]|$)
  - ^vm_stat(?=[ \t]|$)
  # 只读取值形态：sysctl -n 读取、-a 列举。写形态（-w/NAME=VALUE）不匹配，落入风险规则。
  - ^nproc[ \t]*$
  - ^sysctl[ \t]+-n[ \t]+[A-Za-z0-9_.]+(?:[ \t]+[A-Za-z0-9_.]+)*[ \t]*$
  - ^sysctl[ \t]+(-a|--all)[ \t]*$
  - ^(brew[ \t]+(list|info|outdated)|launchctl[ \t]+list)(?=[ \t]|$)
  - ^brew[ \t]+services(?:[ \t]+(list|info)(?=[ \t]|$)|[ \t]*$)

risk_rules:
  R1:
    - ^systemctl\s+(restart|reload)\b
    - ^docker\s+(restart|stop|start)\b
    - ^docker\s+compose\s+(restart|up|stop|start)\b
    - ^brew\s+(install|upgrade|services\s+start)\b
    - ^launchctl\s+(load|unload|kickstart)\b
  R2:
    - ^kubectl\s+(apply|rollout|scale|set|patch|create|replace|edit|taint|cordon|uncordon)\b
    - ^systemctl\s+enable\b
    - ^apt(-get)?\s+(install|remove|upgrade)\b
    - ^yum\s+(install|remove|update)\b
    - ^brew\s+(uninstall|services\s+(stop|restart))\b
    - ^docker\s+(build|push|pull|run)\b
    - ^docker\s+compose\s+(build|pull|down)\b
    - ^(iptables|nft)\b
  R3:
    - ^rm\b.*\s(?:-[a-zA-Z]*[rR][a-zA-Z]*|--r\S*)(?:\s|$)
    - ^systemctl\b.*\s(stop|disable|mask)\b
    - \bmkfs(\.\w+)?\b
    - ^kubectl\b.*\sdelete\b
    - ^docker\b.*\s(rm|rmi|system\s+prune|volume\s+rm)\b
    - \bDROP\s+(TABLE|DATABASE)\b
    - ^dd\s+.*of=/dev/
