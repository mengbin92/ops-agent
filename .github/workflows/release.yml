name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-context:
    name: Validate release tag and documents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      revision: ${{ steps.meta.outputs.revision }}
      tag_object: ${{ steps.meta.outputs.tag_object }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release context
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          number = r"(?:0|[1-9][0-9]*)"
          identifier = r"(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          semver = (rf"v{number}\.{number}\.{number}"
                    rf"(?:-{identifier}(?:\.{identifier})*)?"
                    r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?")
          if re.fullmatch(semver, tag) is None:
              raise SystemExit("Release tag must be a v-prefixed semantic version")

          def git(*args):
              try:
                  return subprocess.check_output(
                      ["git", *args], text=True, stderr=subprocess.PIPE).strip()
              except subprocess.CalledProcessError as exc:
                  raise SystemExit("Release tag or required versioned document is missing") from exc

          # Resolve only refs/tags, never a branch with the same short name.
          git("check-ref-format", f"refs/tags/{tag}")
          tag_object = git("rev-parse", "--verify", f"refs/tags/{tag}")
          revision = git("rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}")
          try:
              git("merge-base", "--is-ancestor", revision, "refs/remotes/origin/main")
          except SystemExit:
              raise SystemExit("Release revision must belong to origin/main history") from None
          if os.environ["EVENT_NAME"] == "push":
              if os.environ["EVENT_REF"] != f"refs/tags/{tag}":
                  raise SystemExit("Release push must refer to the exact version tag")
              event_revision = git("rev-parse", "--verify", os.environ["EVENT_SHA"] + "^{commit}")
              if revision != event_revision:
                  raise SystemExit("Version tag changed after the triggering push")

          version = tag[1:]
          if git("show", f"{revision}:VERSION") != version:
              raise SystemExit("VERSION does not match the release tag")
          notes_path = f"docs/releases/release-{tag}.md"
          notes = git("show", f"{revision}:{notes_path}")
          title = next((line.strip() for line in notes.splitlines() if line.strip()), "")
          if re.match(r"^#\s+ops-agent\s+" + re.escape(tag) + r"(?:\s|[:：]|$)", title) is None:
              raise SystemExit("Release notes title does not match the project and version tag")
          changelog = git("show", f"{revision}:CHANGELOG.md")
          if re.search(r"^## \[" + re.escape(version) + r"\] - \d{4}-\d{2}-\d{2}$",
                       changelog, re.MULTILINE) is None:
              raise SystemExit("CHANGELOG is missing the dated release section")
          readme = git("show", f"{revision}:README.md")
          if readme.count(f"release-{tag}.md") < 2:
              raise SystemExit("README must link release notes in the announcement and release list")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\nrevision={revision}\ntag_object={tag_object}\n")
              output.write("prerelease=" + ("true" if "-" in tag else "false") + "\n")
          print(f"Validated {tag} at {revision}")
          PY

  checks:
    name: Release verification matrix
    needs: release-context
    uses: ./.github/workflows/selftest.yml
    with:
      ref: ${{ needs.release-context.outputs.revision }}
    permissions:
      contents: read

  publish:
    name: Package source and publish GitHub Release
    needs: [release-context, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      RELEASE_REVISION: ${{ needs.release-context.outputs.revision }}
      RELEASE_TAG_OBJECT: ${{ needs.release-context.outputs.tag_object }}
      RELEASE_PRERELEASE: ${{ needs.release-context.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck tag binding and refuse an existing release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          git merge-base --is-ancestor "$RELEASE_REVISION" refs/remotes/origin/main
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_REVISION"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}")" = "$RELEASE_TAG_OBJECT"
          # Read the current remote tag through the authenticated API. No tag
          # creation, force push, release editing or asset clobbering is allowed.
          remote_object="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$remote_object" = "$RELEASE_TAG_OBJECT"
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it." >&2
            exit 1
          fi
      - name: Package the verified commit and publish
        run: |
          set -euo pipefail
          notes="${GITHUB_WORKSPACE}/docs/releases/release-${RELEASE_TAG}.md"
          test -f "$notes"
          output_dir="${RUNNER_TEMP}/release-artifacts"
          mkdir -p "$output_dir"
          archive="ops-agent-${RELEASE_TAG}.tar.gz"
          git archive --format=tar --prefix="ops-agent-${RELEASE_TAG}/" "$RELEASE_REVISION" |
            gzip -n > "${output_dir}/${archive}"
          cd "$output_dir"
          sha256sum "$archive" > SHA256SUMS
          sha256sum --check SHA256SUMS
          args=(release create "$RELEASE_TAG" "$archive" SHA256SUMS
                --repo "$GH_REPO" --verify-tag --target "$RELEASE_REVISION"
                --title "ops-agent ${RELEASE_TAG}" --notes-file "$notes")
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
